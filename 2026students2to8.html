<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 2026-2027 - Esports Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(7, 7, 18, 0.65), rgba(7, 7, 18, 0.65)), url('image02.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px 120px 20px;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* BACKGROUND DYNAMIC GLOW WAVE ACCENTS */
        .ambient-glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .glow-wave-left {
            position: absolute;
            top: 0;
            left: -300px;
            width: 500px;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.16) 0%, transparent 70%);
            animation: floatGlowLeft 8s ease-in-out infinite alternate;
        }

        .glow-wave-right {
            position: absolute;
            top: 0;
            right: -300px;
            width: 500px;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.16) 0%, transparent 70%);
            animation: floatGlowRight 8s ease-in-out infinite alternate;
        }

        @keyframes floatGlowLeft {
            0% { transform: translateX(0) scale(1); opacity: 0.5; }
            100% { transform: translateX(250px) scale(1.1); opacity: 0.8; }
        }

        @keyframes floatGlowRight {
            0% { transform: translateX(0) scale(1); opacity: 0.5; }
            100% { transform: translateX(-250px) scale(1.1); opacity: 0.8; }
        }

        /* INTRO OVERLAY ROOM SETUP */
        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .intro-container.hide-intro {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* SCI-FI GATE SYSTEM LAYERED BEHIND CONTENT BUT IN FRONT OF DASHBOARD ON INTRO */
        .gate-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            pointer-events: none;
        }

        .gate-half {
            width: 50%;
            height: 100%;
            background: linear-gradient(rgba(10, 10, 24, 0.98), rgba(10, 10, 24, 0.98)), url('image02.jpg');
            background-size: cover;
            background-position: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .gate-left {
            border-right: 2px solid rgba(0, 242, 254, 0.4);
            box-shadow: inset -20px 0 40px rgba(0, 242, 254, 0.05);
        }

        .gate-right {
            border-left: 2px solid rgba(255, 0, 127, 0.4);
            box-shadow: inset 20px 0 40px rgba(255, 0, 127, 0.05);
        }

        /* OPEN ACTIVATION LOGIC */
        .intro-container.open-active .gate-left { transform: translateX(-100%); }
        .intro-container.open-active .gate-right { transform: translateX(100%); }
        .intro-container.open-active .intro-content-mesh { opacity: 0; transform: scale(0.85); pointer-events: none; }

        /* INTRO MESH HOLDS BOOK AND PREMIUM WIDGETS SAFELY */
        .intro-content-mesh {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            transition: all 0.8s ease;
        }

        .gaming-book {
            background: rgba(13, 13, 28, 0.95);
            padding: 45px;
            border-radius: 12px;
            text-align: center;
            width: 380px;
            border: 1px solid #ff007f;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.3);
            backdrop-filter: blur(15px);
            transition: all 0.5s ease;
        }

        .gaming-book h2 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff007f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 35px;
        }

        .open-btn {
            background: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            padding: 12px 55px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }

        .open-btn:hover {
            background: #ff007f;
            color: #05050c;
            box-shadow: 0 0 35px #ff007f;
        }

        /* MATCHING INSIDE CARD DESIGN FOR SIDE WIDGETS */
        .premium-side-widget {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(14, 14, 32, 0.85);
            border-radius: 12px;
            padding: 25px 35px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 210px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .widget-glow-bar {
            position: absolute;
            top: 0;
            height: 100%;
            width: 4px;
        }

        .widget-left-side {
            left: 5%;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }
        .widget-left-side .widget-glow-bar { left: 0; background: #00f2fe; }
        .widget-left-side:hover { box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); border-color: #00f2fe; transform: translateY(-50%) scale(1.02); }

        .widget-right-side {
            right: 5%;
            border: 1px solid rgba(255, 0, 127, 0.3);
        }
        .widget-right-side .widget-glow-bar { left: 0; background: #ff007f; }
        .widget-right-side:hover { box-shadow: 0 0 25px rgba(255, 0, 127, 0.4); border-color: #ff007f; transform: translateY(-50%) scale(1.02); }

        .widget-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            opacity: 0.6;
            color: #fff;
            text-transform: uppercase;
        }

        .widget-main-value {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .widget-left-side .widget-main-value { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .widget-right-side .widget-main-value { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }

        .widget-sub-value {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            opacity: 0.9;
        }

        /* MAIN DASHBOARD PANEL */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s;
            z-index: 10;
            position: relative;
        }

        .main-wrapper.show-content {
            opacity: 1;
            transform: translateY(0);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, rgba(10, 10, 25, 0.5), rgba(7, 7, 18, 0.6)), url('image01.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            border: 2px solid rgba(0, 242, 254, 0.6);
            width: 100%;
            max-width: 950px;
        }
        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #00f2fe, #ff007f, #39ff14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 6px;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.3));
            margin-bottom: 25px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .squad-trigger-btn {
            background: rgba(5, 5, 12, 0.9);
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        }

        .squad-trigger-btn:hover {
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
            background: #39ff14;
            color: #05050c;
            transform: scale(1.03);
        }

        .search-wrapper {
            position: relative;
            min-width: 250px;
        }

        .cyber-search {
            width: 100%;
            background: rgba(5, 5, 12, 0.9);
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            outline: none;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.15);
            transition: all 0.3s ease;
        }

        .cyber-search:focus {
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
            background: rgba(10, 10, 25, 0.95);
        }

        .cyber-search::placeholder {
            color: rgba(57, 255, 20, 0.4);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* DYNAMIC POPUP MODAL OVERLAY */
        .matrix-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 4, 12, 0.96);
            backdrop-filter: blur(20px);
            z-index: 10010;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            padding: 20px;
        }

        .matrix-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .matrix-modal {
            background: rgba(13, 13, 28, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.3);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            position: relative;
            transform: scale(0.85) translateY(-30px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .matrix-overlay.active .matrix-modal {
            transform: scale(1) translateY(0);
        }

        .matrix-modal h3 {
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 35px;
            background: linear-gradient(45deg, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .class-grid-mesh {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 10px;
        }

        .lobby-card {
            background: rgba(5, 5, 12, 0.8);
            border-radius: 8px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        /* POPUP NEON LABELS SETUP */
        .btn-neon-green { border: 1px solid rgba(57, 255, 20, 0.4); color: #39ff14; box-shadow: 0 0 10px rgba(57, 255, 20, 0.05); }
        .btn-neon-green:hover { background: linear-gradient(135deg, rgba(57, 255, 20, 0.2), transparent); border-color: #39ff14; box-shadow: 0 0 25px rgba(57, 255, 20, 0.5); transform: translateY(-4px); }

        .btn-neon-cyan { border: 1px solid rgba(0, 242, 254, 0.4); color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.05); }
        .btn-neon-cyan:hover { background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), transparent); border-color: #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.5); transform: translateY(-4px); }

        .btn-neon-pink { border: 1px solid rgba(255, 0, 127, 0.4); color: #ff007f; box-shadow: 0 0 10px rgba(255, 0, 127, 0.05); }
        .btn-neon-pink:hover { background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), transparent); border-color: #ff007f; box-shadow: 0 0 25px rgba(255, 0, 127, 0.5); transform: translateY(-4px); }

        .btn-neon-purple { border: 1px solid rgba(176, 38, 255, 0.4); color: #b026ff; box-shadow: 0 0 10px rgba(176, 38, 255, 0.05); }
        .btn-neon-purple:hover { background: linear-gradient(135deg, rgba(176, 38, 255, 0.2), transparent); border-color: #b026ff; box-shadow: 0 0 25px rgba(176, 38, 255, 0.5); transform: translateY(-4px); }

        .btn-neon-orange { border: 1px solid rgba(255, 103, 0, 0.4); color: #ff6700; box-shadow: 0 0 10px rgba(255, 103, 0, 0.05); }
        .btn-neon-orange:hover { background: linear-gradient(135deg, rgba(255, 103, 0, 0.2), transparent); border-color: #ff6700; box-shadow: 0 0 25px rgba(255, 103, 0, 0.5); transform: translateY(-4px); }

        .lobby-card.master-card {
            grid-column: 1 / -1;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .close-matrix-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-matrix-btn:hover { color: #ff007f; }

        .stats-panel-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }

        .counter-box {
            background: rgba(5, 5, 12, 0.9);
            border: 1px solid #ff007f;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ff007f;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .counter-box:hover { box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); }
        .counter-box span {
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
            font-size: 0.85rem;
        }

        .audio-toast {
            position: fixed;
            top: -100px;
            right: 25px;
            background: rgba(10, 10, 24, 0.95);
            border: 1px solid #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            border-radius: 4px;
            padding: 12px 25px;
            z-index: 10005;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #00f2fe;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .audio-toast.show { top: 25px; }
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 950px;
            padding: 10px 0;
        }

        /* PREMIUM SLIDE UP HOVER ON CARDS */
        .card {
            background: rgba(14, 14, 32, 0.8);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: center;
            position: relative;
            backdrop-filter: blur(8px);
            padding: 25px 40px;
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.3s ease, box-shadow 0.3s ease;
            animation: cardEntrance 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 8px 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover::before { opacity: 1; }
        .card:hover { transform: translateY(-5px) scale(1.005) !important; background: rgba(20, 20, 44, 0.9); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        .card-glow-bar { position: absolute; left: 0; top: 0; height: 100%; width: 4px; }
        .col-name { width: 45%; text-align: left; }
        .col-class { width: 35%; text-align: left; }
        .col-roll { width: 20%; text-align: left; }
        .student-data-item { display: flex; flex-direction: column; gap: 4px; z-index: 2; }
        .data-label { font-size: 0.7rem; letter-spacing: 2px; opacity: 0.6; color: #fff; }
        .student-name { font-size: 1.8rem; font-weight: 800; letter-spacing: 1px; }
        .student-class, .student-roll { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }

        @media (max-width: 920px) {
            .premium-side-widget { position: relative; top: unset; transform: unset; left: unset; right: unset; margin: 10px auto; width: 80%; max-width: 280px; justify-content: center; }
            .intro-content-mesh { flex-direction: column; overflow-y: auto; padding: 40px 10px; gap: 20px; }
            .gaming-book { order: 1; margin: 10px auto; }
        }

        @media (max-width: 600px) {
            .card { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px 25px; }
            .col-name, .col-class, .col-roll { width: 100%; text-align: left; }
            .header h1 { font-size: 2.2rem; }
            .controls-row { flex-direction: column; gap: 15px; width: 100%; }
            .search-wrapper, .squad-trigger-btn { width: 100%; text-align: center; }
            .stats-panel-row { flex-direction: column; gap: 10px; width: 100%; }
            .counter-box { width: 100%; justify-content: center; }
            .matrix-modal { padding: 30px 20px; }
        }

        .neon-cyan { border: 1px solid rgba(0, 242, 254, 0.3); }
        .neon-cyan:hover { box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); border-color: #00f2fe; }
        .neon-cyan .card-glow-bar { background: #00f2fe; }
        .neon-cyan .student-name, .neon-cyan .student-class, .neon-cyan .student-roll { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }

        .neon-pink { border: 1px solid rgba(255, 0, 127, 0.3); }
        .neon-pink:hover { box-shadow: 0 0 25px rgba(255, 0, 127, 0.4); border-color: #ff007f; }
        .neon-pink .card-glow-bar { background: #ff007f; }
        .neon-pink .student-name, .neon-pink .student-class, .neon-pink .student-roll { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }

        .neon-green { border: 1px solid rgba(57, 255, 20, 0.3); }
        .neon-green:hover { box-shadow: 0 0 25px rgba(57, 255, 20, 0.4); border-color: #39ff14; }
        .neon-green .card-glow-bar { background: #39ff14; }
        .neon-green .student-name, .neon-green .student-class, .neon-green .student-roll { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }

        .neon-purple { border: 1px solid rgba(176, 38, 255, 0.3); }
        .neon-purple:hover { box-shadow: 0 0 25px rgba(176, 38, 255, 0.4); border-color: #b026ff; }
        .neon-purple .card-glow-bar { background: #b026ff; }
        .neon-purple .student-name, .neon-purple .student-class, .neon-purple .student-roll { color: #b026ff; text-shadow: 0 0 10px rgba(176, 38, 255, 0.5); }

        .neon-orange { border: 1px solid rgba(255, 103, 0, 0.3); }
        .neon-orange:hover { box-shadow: 0 0 25px rgba(255, 103, 0, 0.4); border-color: #ff6700; }
        .neon-orange .card-glow-bar { background: #ff6700; }
        .neon-orange .student-name, .neon-orange .student-class, .neon-orange .student-roll { color: #ff6700; text-shadow: 0 0 10px rgba(255, 103, 0, 0.5); }

        .media-dock {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 850px;
            background: rgba(10, 10, 24, 0.95);
            border: 1px solid rgba(255, 0, 127, 0.5);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.25);
            border-radius: 12px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            z-index: 9995;
            flex-wrap: wrap;
            gap: 15px;
        }

        .media-controls { display: flex; align-items: center; gap: 15px; }
        .media-btn { background: transparent; border: 1px solid #00f2fe; color: #00f2fe; font-size: 0.8rem; font-weight: 700; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .media-btn:hover { background: #00f2fe; color: #0a0a18; box-shadow: 0 0 15px #00f2fe; }
        .music-select { background: rgba(5, 5, 12, 0.9); color: #ff007f; border: 1px solid #ff007f; padding: 8px 15px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; outline: none; cursor: pointer; }
        .visualizer-box { display: flex; align-items: flex-end; gap: 3px; height: 30px; width: 80px; }
        .v-bar { width: 5px; height: 5px; background: #ff007f; box-shadow: 0 0 8px #ff007f; border-radius: 2px; transition: height 0.15s ease; }

        @keyframes cardEntrance { to { opacity: 1; transform: translateY(0); } }
        @keyframes visualizerDance { 0% { height: 6px; } 50% { height: 28px; } 100% { height: 10px; } }
        .visualizer-box.playing .v-bar:nth-child(1) { animation: visualizerDance 0.6s infinite alternate 0.1s; }

        function startLiveClockAndCalendar() {
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                let seconds = now.getSeconds();
                let ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                hours = hours < 10 ? '0' + hours : hours;

                document.getElementById("liveClockDisplay").innerText = `${hours}:${minutes}:${seconds}`;
                document.getElementById("liveClockPeriod").innerText = ampm;

                const day = now.getDate();
                const monthsList = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
                const month = monthsList[now.getMonth()];
                const year = now.getFullYear();

                document.getElementById("liveCalendarDay").innerText = day < 10 ? '0' + day : day;
                document.getElementById("liveCalendarMonthYear").innerText = `${month} ${year}`;
            }
            setInterval(updateClock, 1000);
            updateClock();
        }

        startLiveClockAndCalendar();

        function initializeLounge() {
            document.getElementById("introContainer").classList.add("open-active");
            setTimeout(() => {
                document.getElementById("introContainer").classList.add("hide-intro");
                mainContent.classList.add("show-content");
                mediaDock.style.display = "flex";
                renderStudents("all");
            }, 1200);
            
            audio.play().then(function() {
                updateVisualizerState(true);
                showAudioToast("MUSIC 01");
            }).catch(function(error) {
                console.log("Audio block by sandbox permissions:", error);
                updateVisualizerState(false);
            });
        }

        function toggleMatrixPopup(isOpen) {
            const matrixOverlay = document.getElementById("matrixLobbyPopup");
            if (isOpen) { 
                matrixOverlay.classList.add("active"); 
                document.body.classList.add("modal-open");
            } 
            else { 
                matrixOverlay.classList.remove("active"); 
                document.body.classList.remove("modal-open");
            }
        }

        function selectSquadFromLobby(classKey, displayTitle, textColor, glowColor) {
            toggleMatrixPopup(false);
            
            const mainBtn = document.getElementById("squadMainBtn");
            mainBtn.innerText = displayTitle;
            mainBtn.style.color = textColor;
            mainBtn.style.borderColor = textColor;
            mainBtn.style.boxShadow = `0 0 15px ${glowColor}`;
            
            mainBtn.onmouseover = function() {
                this.style.boxShadow = `0 0 25px ${textColor}`;
                this.style.background = textColor;
                this.style.color = "#05050c";
            };
            mainBtn.onmouseout = function() {
                this.style.boxShadow = `0 0 15px ${glowColor}`;
                this.style.background = "rgba(5, 5, 12, 0.9)";
                this.style.color = textColor;
            };

            renderStudents(classKey);
        }

        function renderStudents(classKey) {
            container.innerHTML = ""; 
            globalActiveRoster = [];
            document.getElementById("cyberSearchInput").value = "";

            if (classKey === "all") {
                Object.keys(studentsDatabase).forEach(key => {
                    globalActiveRoster = globalActiveRoster.concat(studentsDatabase[key]);
                });
            } else {
                globalActiveRoster = studentsDatabase[classKey];
            }

            document.getElementById("totalStudentsCount").innerText = globalActiveRoster.length;
            buildHTMLCardsGrid(globalActiveRoster);
        }

        function buildHTMLCardsGrid(rosterList) {
            container.innerHTML = "";
            if (rosterList.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#ff007f; padding:40px; width:100%; letter-spacing:2px;">NO SQUAD MEMBERS FOUND //</div>`;
                return;
            }

            rosterList.forEach((student, index) => {
                const cardHTML = `
                    <div class="card ${student.theme}" style="animation-delay: ${index * 0.02}s;">
                        <div class="card-glow-bar"></div>
                        <div class="col-name student-data-item">
                            <div class="data-label">NAME</div>
                            <div class="student-name">${student.name}</div>
                        </div>
                        <div class="col-class student-data-item">
                            <div class="data-label">CLASS</div>
                            <div class="student-class">${student.class}</div>
                        </div>
                        <div class="col-roll student-data-item">
                            <div class="data-label">ROLL NO</div>
                            <div class="student-roll">${student.roll}</div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function filterLiveSearch() {
            const query = document.getElementById("cyberSearchInput").value.toLowerCase().trim();
            const filteredRoster = globalActiveRoster.filter(student => 
                student.name.toLowerCase().includes(query) || 
                student.class.toLowerCase().includes(query) ||
                student.roll.includes(query)
            );
            buildHTMLCardsGrid(filteredRoster);
        }

        function toggleAudio() {
            if (audio.paused) { audio.play(); playPauseBtn.innerHTML = "⏸ PAUSE"; updateVisualizerState(true); } 
            else { audio.pause(); playPauseBtn.innerHTML = "▶ PLAY"; updateVisualizerState(false); }
        }

        function updateVisualizerState(isPlaying) {
            if (isPlaying) { visualizer.classList.add("playing"); } 
            else { visualizer.classList.remove("playing"); }
        }

        function switchMusicTrack() {
            const trackPath = musicDropdown.value;
            currentTrackIndex = tracksPlaylist.indexOf(trackPath);
            loadAndPlayTrack(trackPath);
        }

        function skipTrack(direction) {
            currentTrackIndex += direction;
            if (currentTrackIndex >= tracksPlaylist.length) currentTrackIndex = 0;
            if (currentTrackIndex < 0) currentTrackIndex = tracksPlaylist.length - 1;
            const targetedTrack = tracksPlaylist[currentTrackIndex];
            musicDropdown.value = targetedTrack; 
            loadAndPlayTrack(targetedTrack);
        }

        function loadAndPlayTrack(trackSource) {
            audio.pause();
            audio.setAttribute("src", trackSource);
            audio.load();
            audio.play().then(function() {
                playPauseBtn.innerHTML = "⏸ PAUSE";
                updateVisualizerState(true);
                const friendlyName = musicDropdown.options[musicDropdown.selectedIndex].text;
                showAudioToast(friendlyName.toUpperCase());
            }).catch(function(err) {
                console.log("Track stream error:", err);
                updateVisualizerState(false);
            });
        }

        function showAudioToast(trackName) {
            toastText.innerText = trackName;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3500);
        }
