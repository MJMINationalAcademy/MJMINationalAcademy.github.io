        /* ADVANCED FEATURE 1: SPLIT SCI-FI GATE SYSTEM */
        .gate-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            display: flex;
        }

        .gate-half {
            width: 50%;
            height: 100%;
            background: linear-gradient(rgba(10, 10, 24, 0.98), rgba(10, 10, 24, 0.98)), url('image02.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            pointer-events: auto;
        }

        .gate-left {
            border-right: 2px solid rgba(0, 242, 254, 0.4);
            box-shadow: inset -20px 0 40px rgba(0, 242, 254, 0.05);
            transform-origin: left;
        }

        .gate-right {
            border-left: 2px solid rgba(255, 0, 127, 0.4);
            box-shadow: inset 20px 0 40px rgba(255, 0, 127, 0.05);
            transform-origin: right;
        }

        /* Centralized Interactive Dock Box */
        .gaming-book {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%);
            background: rgba(13, 13, 28, 0.95);
            padding: 45px;
            border-radius: 12px;
            text-align: center;
            width: 380px;
            border: 1px solid #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(15px);
            z-index: 10000;
            transition: all 0.5s ease;
        }

        .gate-right .gaming-book {
            display: none; /* Kept only on one node to prevent double render */
        }

        .gaming-book h2 {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.8rem;
            background: linear-gradient(45deg, #ff007f, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 35px;
        }

        .open-btn:hover {
            background: #ff007f;
            color: #05050c;
            box-shadow: 0 0 35px #ff007f;
        }

        .gate-wrapper.open-active .gate-left { transform: translateX(-100%); }

            flex-direction: column;
            gap: 20px;
            width: 100%;

            align-items: center;

            width: 100%;
            opacity: 0;
            transform: translateY(30px);

            animation: cardEntrance 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        /* ADVANCED FEATURE 3: HOLOGRAM MESH GRID ACCENT ON HOVER */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),

            background-size: 8px 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateX(8px) scale(1.01) !important;
            background: rgba(20, 20, 44, 0.9);
        }

        .card-glow-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
        }

        // Track state settings for playlist controller engine
        const tracksPlaylist = ["music01.mp3", "music02.mp3", "music03.mp3", "music04.mp3", "music05.mp3"];
        let currentTrackIndex = 0;

        // Core UI DOM elements lookup caching
        var audio = document.getElementById("bgAudio");
        var gateSystem = document.getElementById("gateSystem");
        var mainContent = document.getElementById("mainContent");
        var container = document.getElementById("cardsDisplayContainer");
        var mediaDock = document.getElementById("mediaDock");
        var playPauseBtn = document.getElementById("playPauseBtn");
        var visualizer = document.getElementById("visualizer");
        var musicDropdown = document.getElementById("musicDropdown");
        // ADVANCED TRANSITION 1: LOCK SQUAD BREAK GATE ENGINE CONTROL
        function initializeLounge() {
            // Fires split screen door shift mechanism smoothly
            gateSystem.classList.add("open-active");
            
            // Displays main dashboard layout wrapper frame
            mainContent.classList.add("show-content");
            
            // Triggers floating media horizontal deck dashboard panel onto views
            mediaDock.style.display = "flex";
            
            // Primary bootup dataset loading trigger (Renders Class 2nd initially)
            renderStudents("class2");
            
            // Initiates music stream track loop background play execution
            audio.play().then(function() {
                updateVisualizerState(true);
            }).catch(function(error) {
                console.log("Media autolaunch prevented by security block protocols:", error);
                updateVisualizerState(false);
            });
        }

        // CARDS ENTRANCE: Renders cards from left to right with cascading entrance delay
        function renderStudents(classKey) {
            const currentRoster = studentsDatabase[classKey];
            container.innerHTML = ""; // Flushes previous matrix data completely

            currentRoster.forEach((student, index) => {
                const cardHTML = `
                    <div class="card ${student.theme}" style="animation-delay: ${index * 0.05}s;">
                        <div class="card-glow-bar"></div>
                        <div class="col-name student-data-item">
                            <div class="data-label">NAME</div>
                            <div class="student-name">${student.name}</div>
                        </div>
                        <div class="col-class student-data-item">
                            <div class="data-label">CLASS</div>
                            <div class="student-class">${student.class}</div>
                        </div>
                        <div class="col-roll student-data-item">
                            <div class="data-label">ROLL NO</div>
                            <div class="student-roll">${student.roll}</div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Action trigger function fired on Select Class Dropdown switch change
        function switchClassLayout() {
            const dropdown = document.getElementById("classDropdown");
            renderStudents(dropdown.value);
        }

        // DYNAMIC MUSIC ENGINE PRO: Handles Play Pause Action States
        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerHTML = "⏸ PAUSE";
                updateVisualizerState(true);
            } else {
                audio.pause();
                playPauseBtn.innerHTML = "▶ PLAY";
                updateVisualizerState(false);
            }
        }

        // Equalizer waves status controller element updates
        function updateVisualizerState(isPlaying) {
            if (isPlaying) {
                visualizer.classList.add("playing");
            } else {
                visualizer.classList.remove("playing");
            }
        }

        // Manual drop dropdown audio select playlist swapper logic
        function switchMusicTrack() {
            const trackPath = musicDropdown.value;
            currentTrackIndex = tracksPlaylist.indexOf(trackPath);
            loadAndPlayTrack(trackPath);
        }

        // Playlist skip sequential trackers logic controls (PREV / NEXT actions)
        function skipTrack(direction) {
            currentTrackIndex += direction;
            
            // Loop boundaries correction rules
            if (currentTrackIndex >= tracksPlaylist.length) currentTrackIndex = 0;
            if (currentTrackIndex < 0) currentTrackIndex = tracksPlaylist.length - 1;
            
            const targetedTrack = tracksPlaylist[currentTrackIndex];
            musicDropdown.value = targetedTrack; // Syncs state back onto select overlay element box
            loadAndPlayTrack(targetedTrack);
        }

        // Resets node stream loader sources pipeline directly
        function loadAndPlayTrack(trackSource) {
            audio.pause();
            audio.setAttribute("src", trackSource);
            audio.load();
            
            audio.play().then(function() {
                playPauseBtn.innerHTML = "⏸ PAUSE";
                updateVisualizerState(true);
            }).catch(function(err) {
                console.log("Track stream processing fault:", err);
                updateVisualizerState(false);
            });
        }
    </script>
